<div class="app-shell">
  <app-navbar
    [isHome]="!!home()"
    [quizDrawerOpen]="home()?.quizDrawerOpen() ?? false"
    [editor]="editor()"
    (createQuiz)="requestCreateQuiz()"
    (openQuizDrawer)="home()?.openQuizDrawer()"
    (returnHome)="requestHome()"
  ></app-navbar>

  <main>
    <router-outlet (activate)="activePage.set($event)" (deactivate)="activePage.set(null)"></router-outlet>
  </main>
</div>
