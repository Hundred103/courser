<section class="auth-view">
  <div class="auth-card squircle fade-in">
    <div class="auth-heading">
      <h1>Zaloguj się</h1>
    </div>

    <form (ngSubmit)="onSubmit()" #f="ngForm">
      @if (error()) {
        <div class="error-message">{{ error() }}</div>
      }

      <label class="field">
        <span>Adres e-mail</span>
        <input name="email" [(ngModel)]="model.email" type="email" required [disabled]="loading()" />
      </label>

      <label class="field">
        <span>Hasło</span>
        <div class="password-input">
          <input
            [type]="passwordVisible() ? 'text' : 'password'"
            name="password"
            [(ngModel)]="model.password"
            (ngModelChange)="onPasswordChange($event)"
            required
            [disabled]="loading()" />
          @if (model.password) {
            <button
              class="password-visibility-button"
              type="button"
              [disabled]="loading()"
              [attr.aria-label]="passwordVisible() ? 'Ukryj hasło' : 'Pokaż hasło'"
              (click)="togglePasswordVisibility()">
              @if (passwordVisible()) {
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>
              } @else {
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3 21 21M10.2 6.3A10.8 10.8 0 0 1 12 6c6.1 0 9.5 6 9.5 6a16.7 16.7 0 0 1-3.1 3.8M6.4 6.4A16.7 16.7 0 0 0 2.5 12s3.4 6 9.5 6a10.8 10.8 0 0 0 3.6-.6"/><path d="M9.8 9.8a3.1 3.1 0 0 0 4.4 4.4"/></svg>
              }
            </button>
          }
        </div>
      </label>

      <div class="actions">
        <button class="primary-button squircle" type="submit" [disabled]="loading()">
          {{ loading() ? 'Logowanie...' : 'Zaloguj się' }}
        </button>
      </div>

      <div class="auth-footer">
        <p>Nie masz konta? <a routerLink="/register">Zarejestruj się</a></p>
      </div>
    </form>
  </div>
</section>
