services:
  postgres:
    image: postgres:16
    container_name: courser-postgres
    environment:
      POSTGRES_DB: courserdb
      POSTGRES_USER: courseruser
      POSTGRES_PASSWORD: courserpassword
    ports:
      - "5433:5432"
    volumes:
      - courser-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courseruser -d courserdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.33
    container_name: courser-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgre/liquibase/changelog:/liquibase/changelog
    command: >
      --changelog-file=changelog/db.changelog-master.yaml
      --url=jdbc:postgresql://postgres:5432/courserdb
      --username=courseruser
      --password=courserpassword
      --contexts=seed
      update

  quiz-service:
    build:
      context: ./backend/quiz-service
      dockerfile: Dockerfile
    container_name: courser-quiz
    depends_on:
      liquibase:
        condition: service_completed_successfully
    expose:
      - "8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courserdb
      SPRING_DATASOURCE_USERNAME: courseruser
      SPRING_DATASOURCE_PASSWORD: courserpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SERVER_PORT: 8081

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: courser-user-service
    depends_on:
      liquibase:
        condition: service_completed_successfully
    expose:
      - "8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/courserdb
      SPRING_DATASOURCE_USERNAME: courseruser
      SPRING_DATASOURCE_PASSWORD: courserpassword
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      APP_JWT_SECRET: courser-local-development-secret-change-me

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: courser-gateway
    depends_on:
      - quiz-service
      - user-service
    ports:
      - "8080:8080"
    environment:
      QUIZ_SERVICE_URL: http://quiz-service:8081
      USER_SERVICE_URL: http://user-service:8082
      APP_JWT_SECRET: courser-local-development-secret-change-me

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: courser-frontend
    depends_on:
      - gateway
    ports:
      - "4200:80"

volumes:
  courser-postgres-data:
    name: courser-postgres-data