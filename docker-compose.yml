x-database-credentials: &database-credentials
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  postgres:
    image: postgres:16
    container_name: courser-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - courser-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: liquibase/liquibase:4.33.0
    container_name: courser-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./postgre/liquibase/changelog:/liquibase/changelog
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}
      LIQUIBASE_COMMAND_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      LIQUIBASE_COMMAND_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Exec-form keeps the context expression as one argv (spaces in AND must not split).
    command:
      - --changelog-file=changelog/db.changelog-master.xml
      - --contexts=${LIQUIBASE_CONTEXTS:-!seed AND !seed-legacy}
      - update

  media:
    image: nginx:1.27-alpine
    container_name: courser-media
    volumes:
      - courser-media-data:/usr/share/nginx/html
      - ./media/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5

  quiz-service:
    build:
      context: ./backend/quiz-service
      dockerfile: Dockerfile
    container_name: courser-quiz
    depends_on:
      liquibase:
        condition: service_completed_successfully
    expose:
      - "8081"
    volumes:
      - courser-media-data:/var/courser-media
    environment:
      <<: *database-credentials

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: courser-user-service
    depends_on:
      liquibase:
        condition: service_completed_successfully
    expose:
      - "8082"
    environment:
      <<: *database-credentials
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_REFRESH_COOKIE_SECURE: ${APP_REFRESH_COOKIE_SECURE:-false}

  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile
    container_name: courser-gateway
    depends_on:
      - quiz-service
      - user-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      QUIZ_SERVICE_URL: http://quiz-service:8081
      USER_SERVICE_URL: http://user-service:8082
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: courser-frontend
    depends_on:
      - gateway
      - media
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  courser-postgres-data:
    name: courser-postgres-data
  courser-media-data:
    name: courser-media-data
