server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  autoindex off;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Content-addressed quiz images: /<hash>.<ext>
  location / {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
  }

  types {
    image/jpeg jpg jpeg;
    image/png png;
    image/gif gif;
    image/webp webp;
    image/bmp bmp;
  }
}
