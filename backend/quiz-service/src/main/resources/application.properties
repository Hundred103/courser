#NAME
spring.application.name=quiz-service

#PORT
server.port=8081
server.tomcat.max-http-form-post-size=30MB
server.tomcat.max-swallow-size=30MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=30MB

#POSTGRE
spring.datasource.url=jdbc:postgresql://postgres:5432/courserdb
spring.datasource.username=courseruser
spring.datasource.password=courserpassword

#HIBERNATE/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Wygasłe kody i całkowicie osierocone rankingi są czyszczone raz dziennie.
app.ranking-cleanup.expired-code-retention-days=${APP_RANKING_CLEANUP_EXPIRED_CODE_RETENTION_DAYS:30}
app.ranking-cleanup.orphaned-ranking-retention-days=${APP_RANKING_CLEANUP_ORPHANED_RANKING_RETENTION_DAYS:90}

# Content-addressed quiz images (shared volume with media nginx).
app.media.storage-path=${APP_MEDIA_STORAGE_PATH:/var/courser-media}
app.media.public-base-url=${APP_MEDIA_PUBLIC_BASE_URL:/media}
