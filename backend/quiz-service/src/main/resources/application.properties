#NAME
spring.application.name=quiz-service

#PORT
server.port=8081

#POSTGRE
spring.datasource.url=jdbc:postgresql://postgres:5432/courserdb
spring.datasource.username=courseruser
spring.datasource.password=courserpassword

#HIBERNATE/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seconds after a quiz or question deadline during which a late submission is still accepted.
# Submissions after this buffer are rejected as cheating. Hidden from students.
app.quiz.timer.submission-grace-seconds=5
# How early the server tells the player that time is about to run out.
app.quiz.timer.ending-warning-seconds=10