server:
  port: 8080

spring:
  application:
    name: gateway
  http:
    codecs:
      max-in-memory-size: 30MB
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: quiz-service
              uri: ${QUIZ_SERVICE_URL:http://localhost:8081}
              predicates:
                - name: Path
                  args:
                    patterns: '/api/quizzes/**'
              filters:
                - name: StripPrefix
                  args:
                    parts: 1

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - name: Path
                  args:
                    patterns: '/api/users/**'
              filters:
                - name: StripPrefix
                  args:
                    parts: 1

app:
  jwt:
    # Wymagany, bez wartości domyślnej: ten sam sekret co w user-service (co najmniej 32 bajty).
    secret: ${APP_JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info
