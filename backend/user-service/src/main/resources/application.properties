spring.application.name=user-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/courserdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:courseruser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:courserpassword}

# Schemat zmienia wyłącznie Liquibase (postgre/liquibase).
spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health,info

# Wymagany, bez wartości domyślnej: ten sam sekret musi mieć gateway (co najmniej 32 bajty).
app.jwt.secret=${APP_JWT_SECRET}
# Krótki token dostępu jest odnawiany przez sesję przechowywaną w ciasteczku HttpOnly.
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:1800}
app.refresh-session.inactivity-hours=${APP_REFRESH_SESSION_INACTIVITY_HOURS:48}
app.refresh-session.rotation-grace-seconds=${APP_REFRESH_SESSION_ROTATION_GRACE_SECONDS:30}
# Ustaw true, gdy aplikacja jest serwowana przez HTTPS.
app.refresh-cookie.secure=${APP_REFRESH_COOKIE_SECURE:false}
